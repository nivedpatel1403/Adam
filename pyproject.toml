[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adam"
version = "0.1.0"
description = "ADAM: Automated Deception and Adaptive Malware Analysis Sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.3,<3",
    "aiosqlite>=0.20,<1",
    "python-evtx>=0.8.1,<0.9",
    "rich>=13,<15",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "PyYAML>=6.0",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "jinja2>=3.1,<4",
    "aiohttp>=3.9,<4",
    "python-multipart>=0.0.32",
    "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.16",
    "black>=25.0",
    "ruff>=0.12",
]

[project.scripts]
adam = "adam.cli.main:app"

[tool.setuptools.packages.find]
include = ["adam*"]

[tool.setuptools.package-data]
adam = ["dashboard/templates/*.html", "sandbox/guest/agent/*.ps1", "sandbox/guest/agent/*.json", "sandbox/guest/agent/*.xml", "sandbox/guest/agent/modules/*.psm1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires a real VM/guest agent",
    "network: binds a real host port",
    "vm: requires VirtualBox",
]

[tool.ruff]
line-length = 100
target-version = "py311"
