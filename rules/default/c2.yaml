# C2 treatment policy.
#
# RULE-023 fabricates a plausible response instead of terminating the
# offending process.  Termination ends the observation window and defeats
# the behavioural-yield experiment; containment, if needed, belongs in a
# separate opt-in ruleset, not in the default C2 rule.
- id: RULE-023
  version: "1.0.0"
  description: >
    C2 beaconing detected -> fabricate a plausible C2 response and keep
    observing the adversary.
  when:
    intent: C2_BEACON
    confidence_gte: 0.70
  then:
    action: FABRICATE_C2_RESPONSE
    priority: 85
    parameters:
      response_body: "fake_c2_payload"
  budget:
    max_per_session: 1
    cooldown_seconds: 60
